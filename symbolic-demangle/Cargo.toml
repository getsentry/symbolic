[package]
name = "symbolic-demangle"
version.workspace = true
license.workspace = true
authors.workspace = true
documentation = "https://docs.rs/symbolic-demangle"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
description = """
A library to demangle symbols from various languages and compilers.
"""
build = "build.rs"
edition.workspace = true
rust-version.workspace = true

exclude = ["tests/**/*"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["cpp", "msvc", "rust", "swift"]
cpp = ["cpp_demangle"]
msvc = ["dep:bitflags", "dep:itoa"]
rust = ["rustc-demangle"]
swift = ["cc"]

[dependencies]
cpp_demangle = { workspace = true, optional = true }
rustc-demangle = { workspace = true, optional = true }
symbolic-common = { version = "14.0.0-alpha.4", path = "../symbolic-common" }
bitflags = { version = "2", optional = true, default-features = false }
itoa = { version = "1.0", optional = true }
thiserror = { workspace = true }

[build-dependencies]
cc = { workspace = true, optional = true }

[dev-dependencies]
similar-asserts = { workspace = true }
