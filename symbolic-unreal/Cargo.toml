[package]
name = "symbolic-unreal"
version.workspace = true
license.workspace = true
authors.workspace = true
documentation = "https://docs.rs/symbolic-unreal"
repository.workspace = true
description = """
Parsing and processing utilities for Unreal Engine 4 crash files.
"""
edition.workspace = true
rust-version.workspace = true

exclude = ["tests/**/*"]

[package.metadata.docs.rs]
all-features = true

[features]
serde = ["dep:serde", "chrono/serde"]

[dependencies]
anylog = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
quick-xml = { workspace = true }
flate2 = { workspace = true }
regex = { workspace = true }
scroll = { workspace = true, features = ["derive"] }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }
time = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
similar-asserts = { workspace = true }
symbolic-testutils = { path = "../symbolic-testutils" }

[lints.clippy]
# fix(SYMBOL-37): This is a false positive triggered in derive macros.
# See https://linear.app/getsentry/issue/SYMBOL-37 and https://github.com/rust-lang/rust-clippy/issues/17525.
redundant_field_names = "allow"
