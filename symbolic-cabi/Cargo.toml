[package]
name = "symbolic-cabi"
version = "14.0.0-alpha.4"
license = "MIT"
authors.workspace = true
homepage = "https://github.com/getsentry/symbolic"
repository = "https://github.com/getsentry/symbolic"
description = """
C interface wrapper for symbolic, a library to symbolicate and process stack
traces from native applications, minidumps or minified JavaScript.
"""
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
sourcemap = { workspace = true }
symbolic = { version = "14.0.0-alpha.4", path = "../symbolic", features = [
    "cfi",
    "debuginfo",
    "sourcemapcache",
    "symcache",
] }
tempfile = { workspace = true }
