[package]
name = "symbolic-sourcemapcache-fuzz"
version = "14.0.0-alpha.5"
authors = ["Sentry <hello@sentry.io>"]
license = "MIT"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.symbolic-sourcemapcache]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_sourcemapcache"
path = "fuzz_targets/fuzz_sourcemapcache.rs"
test = false
doc = false
