[package]
name = "symbolic-wasm"
version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = """
WebAssembly bindings for symbolic, published to npm as @sentry/symbolic.
"""
edition.workspace = true
rust-version.workspace = true
# Published to npm (@sentry/symbolic), not crates.io.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
symbolic-common = { version = "14.0.0-alpha.4", path = "../symbolic-common" }
symbolic-debuginfo = { version = "14.0.0-alpha.4", path = "../symbolic-debuginfo", default-features = false, features = [
    "breakpad",
    "elf",
    "macho",
    "ms",
    "ppdb",
    "sourcebundle",
    "js",
    "wasm",
] }
symbolic-il2cpp = { version = "14.0.0-alpha.4", path = "../symbolic-il2cpp" }

serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
thiserror = { workspace = true }
wasm-bindgen = { workspace = true }

# NOTE: profile settings for the wasm build are applied via `--config` in
# build-npm.sh — a `[profile.release]` here would be ignored by Cargo because
# this is not the workspace root package.

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
